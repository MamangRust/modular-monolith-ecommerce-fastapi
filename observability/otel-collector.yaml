receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317"
      http:
        endpoint: "0.0.0.0:4318"

processors:
  batch:
    timeout: 10s
    send_batch_size: 1024
    send_batch_max_size: 2048

  memory_limiter:
    check_interval: 1s
    limit_mib: 512
  resource:
    attributes:
      - key: deployment.environment
        value: production
        action: upsert

exporters:
  otlp:
    endpoint: "jaeger:4317"
    tls:
      insecure: true

  # Metric names as scraped by Prometheus are
  #   python_app_<otel.instrument.name with unit suffix>
  # e.g. http.server.duration (unit "ms") -> python_app_http_server_duration_milliseconds,
  #      email_sent_total (unit "1")      -> python_app_email_sent_total.
  # resource_to_telemetry_conversion is what turns the SDK Resource
  # (service.name / service.version / deployment.environment) into the
  # service_name label every dashboard and alert groups by. Without it the
  # series carry no identity and nothing in this folder can select them.
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: "python_app"
    const_labels:
      environment: "production"
    resource_to_telemetry_conversion:
      enabled: true
    enable_open_metrics: true

  otlphttp/loki:
    endpoint: "http://loki:3100/otlp"
    tls:
      insecure: true
    timeout: 10s

  debug:
    verbosity: detailed
    sampling_initial: 5
    sampling_thereafter: 200

extensions:
  health_check:
    endpoint: "0.0.0.0:13133"
  pprof:
    endpoint: "0.0.0.0:1777"
  zpages:
    endpoint: "0.0.0.0:55679"

service:
  extensions: [ health_check, pprof, zpages ]

  pipelines:
    traces:
      receivers: [ otlp ]
      processors: [ memory_limiter, batch, resource ]
      exporters: [ otlp ]

    metrics:
      receivers: [ otlp ]
      processors: [ memory_limiter, batch, resource ]
      exporters: [ prometheus ]

    logs:
      receivers: [ otlp ]
      processors: [ memory_limiter, batch, resource ]
      exporters: [ otlphttp/loki ]

  telemetry:
    logs:
      level: "info"
    # The collector's own metrics are scraped by Prometheus from another
    # container, so the default loopback bind (127.0.0.1:8888) is not
    # reachable — publish it on all interfaces explicitly.
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: "0.0.0.0"
                port: 8888
