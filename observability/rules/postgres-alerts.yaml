# PostgreSQL alerts (postgres-exporter).
groups:
  - name: postgres-alerts
    rules:
      - alert: PostgresDown
        expr: up{job="postgres-exporter"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL exporter is down"
          description: "Prometheus cannot scrape postgres-exporter for 2 minutes."

      - alert: PostgresTooManyConnections
        expr: sum(pg_stat_database_numbackends) > 180
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL connection count is high ({{ $value }})"
          description: "Total backends exceed 180 — approaching max_connections."

      - alert: PostgresHighDeadlocks
        expr: sum(increase(pg_stat_database_deadlocks[10m])) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Deadlocks detected in PostgreSQL"
          description: "At least one deadlock occurred in the last 10 minutes."

      - alert: PostgresLowCacheHitRatio
        expr: |
          sum(rate(pg_stat_database_blks_hit[5m]))
          /
          (sum(rate(pg_stat_database_blks_hit[5m])) + sum(rate(pg_stat_database_blks_read[5m]))) < 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL cache hit ratio below 90%"
          description: "Buffer cache hit ratio is under 90% — consider more shared_buffers or a smaller working set."

      - alert: PostgresHighRollbackRate
        expr: |
          sum(rate(pg_stat_database_xact_rollback[5m]))
          /
          (sum(rate(pg_stat_database_xact_commit[5m])) + sum(rate(pg_stat_database_xact_rollback[5m]))) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL rollback rate above 5%"
          description: "More than 5% of transactions are rolling back."
